<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | PetCare Hub'">PetCare Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <style>
        :root {
            --pch-primary: #1B4965;
            --pch-mint: #62B6CB;
            --pch-coral: #E76F51;
            --pch-bg: #F8FAFC;
        }
        body {
            background-color: var(--pch-bg);
            font-family: 'Segoe UI', Inter, system-ui, sans-serif;
            color: #1E293B;
        }
        .topbar-pch {
            background-color: var(--pch-primary);
            color: #ffffff;
            font-size: 0.82rem;
            padding: 6px 0;
        }
        .btn-coral {
            background-color: var(--pch-coral);
            color: #ffffff;
            border-radius: 8px;
            font-weight: 600;
            border: none;
        }
        .btn-coral:hover {
            background-color: #d45d3f;
            color: #ffffff;
        }
        .text-coral { color: var(--pch-coral); }
        .text-petroleo { color: var(--pch-primary); }
        .card-pch {
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            background: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-pch:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(27, 73, 101, 0.08);
        }
        .hero-section {
            background: linear-gradient(135deg, #EFF6FF 0%, #ECFDF5 100%);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
        }
    </style>
</head>
<body>

<header th:fragment="header">
    <div class="topbar-pch">
        <div class="container d-flex justify-content-between align-items-center">
            <span>Envío gratis en compras mayores a ₡35.000</span>
            <span>Ayuda &bull; San José, CR</span>
        </div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <span class="badge p-2" style="background-color: var(--pch-coral);">
                    <i class="fa-solid fa-paw text-white"></i>
                </span>
                <span class="text-petroleo">PetCare <span class="text-coral">Hub</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPetCare">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navPetCare">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-2">
                    <li class="nav-item"><a class="nav-link fw-medium" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" th:href="@{/productos}">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" th:href="@{/servicios}">Servicios y citas</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" th:href="@{/cliente/mascotas}">Mis mascotas</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" th:href="@{/admin/dashboard}">Administración</a></li>
                </ul>
                <form class="d-flex me-3" th:action="@{/productos}" method="get">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                        <input class="form-control bg-light border-start-0" type="search" name="q" th:value="${q}" placeholder="Buscar productos..."/>
                    </div>
                </form>
                <div class="d-flex align-items-center gap-3">
                    <a th:href="@{/login}" class="text-dark text-decoration-none" title="Mi Cuenta">
                        <i class="fa-regular fa-user fs-5"></i>
                    </a>
                    <a th:href="@{/carrito}" class="text-dark text-decoration-none position-relative">
                        <i class="fa-solid fa-cart-shopping fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
                              style="background-color: var(--pch-coral);"
                              th:text="${totalCarrito != null ? totalCarrito : 0}">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer" class="bg-white border-top py-4 mt-5">
    <div class="container d-flex justify-content-between align-items-center small text-muted">
        <span>&copy; 2026 PetCare Hub - SC-403 Desarrollo de Aplicaciones Web y Patrones</span>
        <span>José David Morales Alfaro | Universidad Fidélitas</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
