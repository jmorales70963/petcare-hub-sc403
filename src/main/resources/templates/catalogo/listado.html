<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/plantilla :: head('Catálogo de Productos')}"></head>
<body>
<header th:replace="~{layout/plantilla :: header}"></header>

<main class="container my-4">
    <div class="mb-4">
        <small class="text-coral fw-bold text-uppercase">Para cada necesidad</small>
        <h2 class="fw-bold text-petroleo">Productos para su bienestar</h2>
        <p class="text-muted">Todo lo que necesitan para crecer sanos y felices.</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-3">
            <form th:action="@{/productos}" method="get" class="card-pch p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0">Filtros</h6>
                    <a th:href="@{/productos}" class="small text-coral text-decoration-none">Limpiar</a>
                </div>

                <p class="fw-semibold small mb-2">Mascota</p>
                <div class="form-check mb-1">
                    <input class="form-check-input" type="radio" name="especie" value="" th:checked="${especieSeleccionada == null or especieSeleccionada == ''}"/>
                    <label class="form-check-label small">Todos</label>
                </div>
                <div class="form-check mb-1">
                    <input class="form-check-input" type="radio" name="especie" value="Perros" th:checked="${especieSeleccionada == 'Perros'}"/>
                    <label class="form-check-label small">Perros</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="especie" value="Gatos" th:checked="${especieSeleccionada == 'Gatos'}"/>
                    <label class="form-check-label small">Gatos</label>
                </div>

                <p class="fw-semibold small mb-2">Categoría</p>
                <div class="form-check mb-1">
                    <input class="form-check-input" type="radio" name="idCategoria" value="" th:checked="${categoriaSeleccionada == null}"/>
                    <label class="form-check-label small">Todas</label>
                </div>
                <div class="form-check mb-1" th:each="c : ${categorias}">
                    <input class="form-check-input" type="radio" name="idCategoria" th:value="${c.idCategoria}" th:checked="${categoriaSeleccionada == c.idCategoria}"/>
                    <label class="form-check-label small" th:text="${c.nombre}">Categoría</label>
                </div>

                <p class="fw-semibold small mt-3 mb-1">Precio máximo (CRC)</p>
                <input type="range" class="form-range" name="precioMax" min="5000" max="50000" step="1000" th:value="${precioMax}"/>
                <div class="d-flex justify-content-between small text-muted mb-3">
                    <span>₡5.000</span>
                    <span th:text="'Hasta ₡' + ${#numbers.formatDecimal(precioMax, 1, 'POINT', 0, 'COMMA')}">₡50.000</span>
                </div>

                <button type="submit" class="btn btn-coral w-100 btn-sm py-2">Aplicar filtros</button>
            </form>
        </div>

        <div class="col-lg-9">
            <div th:if="${#lists.isEmpty(productos)}" class="alert alert-warning">
                Sin resultados para los filtros seleccionados.
            </div>
            <div class="row g-4">
                <div class="col-md-4" th:each="p : ${productos}">
                    <div class="card-pch p-3 h-100 d-flex flex-column justify-content-between">
                        <div>
                            <a th:href="@{/productos/{id}(id=${p.idProducto})}">
                                <img th:src="${p.rutaImagen}" class="img-fluid rounded-3 mb-3 w-100" style="height: 190px; object-fit: cover;" th:alt="${p.nombre}"/>
                            </a>
                            <small class="text-muted text-uppercase fw-semibold" th:text="${p.marca}">MARCA</small>
                            <h6 class="fw-bold mt-1">
                                <a th:href="@{/productos/{id}(id=${p.idProducto})}" class="text-dark text-decoration-none" th:text="${p.nombre}">Producto</a>
                            </h6>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="fs-5 fw-bold text-petroleo" th:text="'₡' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">₡36.000</span>
                            <form th:action="@{/carrito/agregar}" method="post">
                                <input type="hidden" name="idProducto" th:value="${p.idProducto}"/>
                                <button type="submit" class="btn btn-sm rounded-circle text-white"
                                        th:disabled="${p.existencias == 0}"
                                        style="background-color: var(--pch-primary); width: 36px; height: 36px;">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/plantilla :: footer}"></footer>
</body>
</html>
